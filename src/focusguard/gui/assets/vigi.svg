<!-- Source of truth: docs/vigi.svg in the repo root. Keep this copy in sync. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <defs>
    <linearGradient id="vigi-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b8afd"/>
      <stop offset="1" stop-color="#3a5ce8"/>
    </linearGradient>
    <linearGradient id="vigi-limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78e8"/>
      <stop offset="1" stop-color="#3450c9"/>
    </linearGradient>
  </defs>
  <style>
    .look, .blink { transform-box: fill-box; transform-origin: center; }
    .look  { animation: vigi-look 9s ease-in-out infinite; }
    .blink { animation: vigi-blink 5s ease-in-out infinite; }
    @keyframes vigi-look {
      0%, 50%   { transform: translateX(0); }
      58%, 68%  { transform: translateX(-3.5px); }
      76%, 86%  { transform: translateX(3.5px); }
      94%, 100% { transform: translateX(0); }
    }
    @keyframes vigi-blink {
      0%, 90%, 100% { transform: scaleY(1); }
      94%           { transform: scaleY(0.1); }
    }
  </style>

  <ellipse cx="60" cy="141" rx="30" ry="6" fill="#000000" opacity="0.15"/>

  <!-- feet -->
  <ellipse cx="46" cy="118" rx="9" ry="5" fill="#2a3f8f"/>
  <ellipse cx="74" cy="118" rx="9" ry="5" fill="#2a3f8f"/>

  <!-- arms -->
  <ellipse cx="11" cy="92" rx="9" ry="16" fill="url(#vigi-limb)" stroke="#22337a" stroke-width="1.5" transform="rotate(-18 11 92)"/>
  <ellipse cx="109" cy="92" rx="9" ry="16" fill="url(#vigi-limb)" stroke="#22337a" stroke-width="1.5" transform="rotate(18 109 92)"/>

  <!-- body / shield -->
  <path d="M60 8 L105 24 V56 C105 84 86 103 60 113 C34 103 15 84 15 56 V24 Z"
        fill="url(#vigi-body)" stroke="#22337a" stroke-width="2"/>

  <!-- smile -->
  <path d="M49 89 Q60 97 71 89" fill="none" stroke="#22337a" stroke-width="3" stroke-linecap="round"/>

  <!-- eyes -->
  <g class="look">
    <g class="blink">
      <rect x="40" y="53" width="13" height="23" rx="6.5" fill="#22337a"/>
      <rect x="67" y="53" width="13" height="23" rx="6.5" fill="#22337a"/>
      <circle cx="44.5" cy="60.5" r="2.4" fill="#ffffff"/>
      <circle cx="71.5" cy="60.5" r="2.4" fill="#ffffff"/>
    </g>
  </g>
</svg>
