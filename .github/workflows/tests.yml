name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PyGObject/GTK4/libadwaita are system packages, not pip installable --
      # mirrors the "Development / tests" setup in README.md exactly, so
      # what works here works for a contributor's own machine too.
      - name: Install system dependencies (GTK4 / libadwaita / PyGObject)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Create virtualenv with system site-packages
        run: python3 -m venv .venv --system-site-packages

      - name: Install project + test dependencies
        run: .venv/bin/pip install -e . pytest

      - name: Run tests
        run: .venv/bin/python -m pytest -v
