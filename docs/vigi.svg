<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <defs>
    <linearGradient id="vigi-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b8afd"/>
      <stop offset="1" stop-color="#3a5ce8"/>
    </linearGradient>
    <linearGradient id="vigi-limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78e8"/>
      <stop offset="1" stop-color="#3450c9"/>
    </linearGradient>
  </defs>
  <style>
    /* -- whole-body idle bob + tilt --------------------------------- */
    .floater {
      transform-box: fill-box; transform-origin: center;
      animation: vigi-float 3.4s ease-in-out infinite;
    }
    @keyframes vigi-float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-6px) rotate(-2deg); }
    }

    /* -- shadow squashes opposite the bob, for a grounded feel ------ */
    .shadow {
      transform-box: fill-box; transform-origin: center;
      animation: vigi-shadow 3.4s ease-in-out infinite;
    }
    @keyframes vigi-shadow {
      0%, 100% { transform: scale(1);    opacity: 0.15; }
      50%      { transform: scale(0.72); opacity: 0.07; }
    }

    /* -- soft radar-style "on guard" pulse ring ---------------------- */
    .pulse {
      transform-box: fill-box; transform-origin: center;
      animation: vigi-pulse 4s ease-out infinite;
    }
    @keyframes vigi-pulse {
      0%        { transform: scale(0.7); opacity: 0.35; }
      70%, 100% { transform: scale(1.25); opacity: 0; }
    }

    /* -- eyes: shared glance, independent blinks (for an occasional
          one-eyed wink) -------------------------------------------- */
    .look { transform-box: fill-box; transform-origin: center; animation: vigi-look 9s ease-in-out infinite; }
    @keyframes vigi-look {
      0%, 50%   { transform: translateX(0); }
      58%, 68%  { transform: translateX(-3.5px); }
      76%, 86%  { transform: translateX(3.5px); }
      94%, 100% { transform: translateX(0); }
    }
    .blink-left, .blink-right { transform-box: fill-box; transform-origin: center; }
    .blink-left  { animation: vigi-blink-left 5s ease-in-out infinite; }
    .blink-right { animation: vigi-blink-right 15s ease-in-out infinite; }
    @keyframes vigi-blink-left {
      0%, 90%, 100% { transform: scaleY(1); }
      94%           { transform: scaleY(0.1); }
    }
    @keyframes vigi-blink-right {
      /* blinks together with the left eye at ~5s and ~10s marks... */
      0%, 29%, 33%, 62%, 66%, 96%, 100% { transform: scaleY(1); }
      31%, 64%, 98% { transform: scaleY(0.1); }
      /* ...plus one solo wink partway through, while the left eye
         is independently mid-open. */
      48%, 52% { transform: scaleY(1); }
      50%      { transform: scaleY(0.1); }
    }

    /* -- one arm gives a little wave every so often ------------------ */
    .wave-arm {
      transform-box: fill-box; transform-origin: 50% 12%;
      animation: vigi-wave 12s ease-in-out infinite;
    }
    @keyframes vigi-wave {
      0%, 80%, 100% { transform: rotate(0deg); }
      83% { transform: rotate(-16deg); }
      86% { transform: rotate(10deg); }
      89% { transform: rotate(-14deg); }
      92% { transform: rotate(8deg); }
      95% { transform: rotate(0deg); }
    }

    /* -- ambient sparkle twinkles ------------------------------------ */
    .sparkle {
      opacity: 0;
      transform-box: fill-box; transform-origin: center;
      animation-name: vigi-sparkle;
      animation-duration: 6s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    .sparkle-1 { animation-delay: 0s; }
    .sparkle-2 { animation-delay: 2s; }
    .sparkle-3 { animation-delay: 4s; }
    @keyframes vigi-sparkle {
      0%, 85%, 100% { opacity: 0;   transform: translateY(0) scale(0.5); }
      90%           { opacity: 1;   transform: translateY(-3px) scale(1); }
      96%           { opacity: 0;   transform: translateY(-7px) scale(0.7); }
    }
  </style>

  <ellipse class="shadow" cx="60" cy="141" rx="30" ry="6" fill="#000000" opacity="0.15"/>

  <!-- ambient sparkles, drifting independently of the bob -->
  <g transform="translate(22,16) rotate(45)">
    <rect class="sparkle sparkle-1" x="-3" y="-3" width="6" height="6" fill="#ffffff"/>
  </g>
  <g transform="translate(97,22) rotate(45)">
    <rect class="sparkle sparkle-2" x="-2.5" y="-2.5" width="5" height="5" fill="#cfe0ff"/>
  </g>
  <g transform="translate(78,6) rotate(45)">
    <rect class="sparkle sparkle-3" x="-2" y="-2" width="4" height="4" fill="#ffffff"/>
  </g>

  <g class="floater">
    <!-- soft guard pulse, behind everything else -->
    <circle class="pulse" cx="60" cy="62" r="46" fill="none" stroke="#6b8afd" stroke-width="2"/>

    <!-- feet -->
    <ellipse cx="46" cy="118" rx="9" ry="5" fill="#2a3f8f"/>
    <ellipse cx="74" cy="118" rx="9" ry="5" fill="#2a3f8f"/>

    <!-- arms -->
    <ellipse cx="11" cy="92" rx="9" ry="16" fill="url(#vigi-limb)" stroke="#22337a" stroke-width="1.5" transform="rotate(-18 11 92)"/>
    <g transform="rotate(18 109 92)">
      <g class="wave-arm">
        <ellipse cx="109" cy="92" rx="9" ry="16" fill="url(#vigi-limb)" stroke="#22337a" stroke-width="1.5"/>
      </g>
    </g>

    <!-- body / shield -->
    <path d="M60 8 L105 24 V56 C105 84 86 103 60 113 C34 103 15 84 15 56 V24 Z"
          fill="url(#vigi-body)" stroke="#22337a" stroke-width="2"/>

    <!-- smile -->
    <path d="M49 89 Q60 97 71 89" fill="none" stroke="#22337a" stroke-width="3" stroke-linecap="round"/>

    <!-- eyes -->
    <g class="look">
      <rect class="blink-left"  x="40" y="53" width="13" height="23" rx="6.5" fill="#22337a"/>
      <rect class="blink-right" x="67" y="53" width="13" height="23" rx="6.5" fill="#22337a"/>
      <circle cx="44.5" cy="60.5" r="2.4" fill="#ffffff"/>
      <circle cx="71.5" cy="60.5" r="2.4" fill="#ffffff"/>
    </g>
  </g>
</svg>
