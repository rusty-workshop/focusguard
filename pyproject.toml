[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focusguard"
version = "0.1.0"
description = "GUI app blocker / focus mode for Arch Linux + Hyprland"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "PyGObject>=3.50",
]

[project.scripts]
focusguardd = "focusguard.daemon.__main__:main"
focusguardctl = "focusguard.cli:main"

[project.gui-scripts]
focusguard = "focusguard.gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
