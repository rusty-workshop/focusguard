[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focusguard"
version = "0.1.0"
description = "GUI app blocker / focus mode for Arch Linux + Hyprland"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
# PyGObject/GTK4/libadwaita are intentionally NOT listed here: they must
# come from the system's own package manager (python-gobject/gtk4/
# libadwaita on Arch, python3-gi/gir1.2-gtk-4.0/gir1.2-adw-1 on Debian/
# Ubuntu) -- see README's Installing section. Declaring "PyGObject" as a
# pip dependency makes pip try to build it (and pycairo) from source
# whenever the system copy doesn't satisfy the version pin, which needs a
# full C/meson/cairo-dev toolchain that isn't installed here and isn't
# ours to require.
dependencies = []

[project.scripts]
focusguardd = "focusguard.daemon.__main__:main"
focusguardctl = "focusguard.cli:main"

[project.gui-scripts]
focusguard = "focusguard.gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"focusguard.gui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
