<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b8afd"/>
      <stop offset="1" stop-color="#3a5ce8"/>
    </linearGradient>
  </defs>
  <style>
    .look, .blink { transform-box: fill-box; transform-origin: center; }
    .look  { animation: fg-look 9s ease-in-out infinite; }
    .blink { animation: fg-blink 5s ease-in-out infinite; }
    @keyframes fg-look {
      0%, 50%   { transform: translateX(0); }
      58%, 68%  { transform: translateX(-2.3px); }
      76%, 86%  { transform: translateX(2.3px); }
      94%, 100% { transform: translateX(0); }
    }
    @keyframes fg-blink {
      0%, 90%, 100% { transform: scaleY(1); }
      94%           { transform: scaleY(0.1); }
    }
  </style>
  <path d="M32 4 L56 13 V30 C56 45 46 55 32 60 C18 55 8 45 8 30 V13 Z" fill="url(#g)" stroke="#22337a" stroke-width="1.5"/>
  <g class="look">
    <g class="blink">
      <rect x="21.5" y="29" width="7" height="12" rx="3.5" fill="#22337a"/>
      <rect x="35.5" y="29" width="7" height="12" rx="3.5" fill="#22337a"/>
      <circle cx="23.7" cy="32.3" r="1.3" fill="#ffffff"/>
      <circle cx="37.7" cy="32.3" r="1.3" fill="#ffffff"/>
    </g>
  </g>
</svg>
